<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2>Budget Settings</h2>
          <button class="close-btn" (click)="closeModal()" type="button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <!-- Success/Error Messages -->
        <div class="alert alert-success" *ngIf="successMessage">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ successMessage }}
        </div>

        <div class="alert alert-error" *ngIf="errorMessage">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ errorMessage }}
        </div>
       
        <!-- Current Budget Categories -->
        <div class="form-section" *ngIf="budgetConfigs.length > 0">
          <h3>Current Limits</h3>
          <div class="budget-list">
            <div class="budget-item" *ngFor="let config of budgetConfigs; trackBy: trackByCategory">
              <div class="budget-info">
                <span class="category-name">{{ getCategoryName(config.category_id) }}</span>
                <span class="budget-amount">{{ config.monthlyLimit | number:'1.2-2' }}€</span>
              </div>
              <button type="button" class="btn-remove" (click)="removeBudgetCategory(config.category_id)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>Add Monthly Limit</h3>
         
          <div class="add-category-section">
            <div class="form-group">
              <label>Select or create a category</label>
              <select
                [(ngModel)]="selectedCategoryId"
                name="newCategory"
                class="form-control"
                (ngModelChange)="onCategoryChange()">
                <option value="">Select a category</option>
                <option *ngFor="let category of availableCategories" [value]="category.id">
                  {{ category.name }}
                </option>
              </select>
            </div>
            
            <div class="form-group" *ngIf="!selectedCategoryId">
              <label>Or create a new category</label>
              <input
                type="text"
                [(ngModel)]="customCategoryName"
                name="customCategoryName"
                class="form-control"
                placeholder="New category name">
            </div>
           
            <div class="form-group" *ngIf="selectedCategoryId || customCategoryName">
              <label>Monthly limit</label>
              <div class="input-group">
                <input
                  type="number"
                  [(ngModel)]="newBudgetLimit"
                  name="newBudgetLimit"
                  class="form-control"
                  min="0"
                  step="0.01"
                  placeholder="0.00">
                <span class="input-suffix">€</span>
              </div>
            </div>
           
            <button
              type="button"
              class="btn btn-primary"
              (click)="addBudgetCategory()"
              [disabled]="!(selectedCategoryId || customCategoryName) || !newBudgetLimit">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Add Budget
            </button>
            
            <div *ngIf="availableCategories.length === 0 && !customCategoryName" class="no-categories-message">
              <p>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                  <path d="M12 16v-4m0-4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                No categories available. Create a new category above.
              </p>
            </div>
          </div>
        </div>
       
        <div class="alert-section">
          <h3>Alert Settings</h3>           
          <div class="form-group">
            <label>Alert threshold ({{ alertSettings.warningThreshold }}%)</label>
            <div class="input-group range-group">
              <input
                type="range"
                [(ngModel)]="alertSettings.warningThreshold"
                name="warningThreshold"
                class="range-slider"
                min="50"
                max="100"
                step="5">
              <span class="range-value">{{ alertSettings.warningThreshold }}%</span>
            </div>
          </div>
        </div>
       
        <div class="modal-footer">
          <button (click)="closeModal()" class="btn btn-outline" type="button">
            Close
          </button>
        </div>
      </div>
    </div>

<mat-card>
  <mat-card-header>
    <mat-card-title>Budget per category</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="orders" class="mat-elevation-z1 full-width-table">
<!-- Category Column -->
<ng-container matColumnDef="category">
  <th mat-header-cell *matHeaderCellDef> Category </th>
  <td mat-cell *matCellDef="let order"> {{ order.category }} </td>
</ng-container>

<!-- Spent Column with Progress Bar -->
<ng-container matColumnDef="spent" class="progress-column">
  <th mat-header-cell *matHeaderCellDef> Spent </th>
  <td mat-cell *matCellDef="let order">
    <div class="progress-cell">
      <mat-progress-bar
        mode="determinate"
        [value]="(order.spent / order.amount) * 100"
        [color]="getProgressColor(order.status)">
      </mat-progress-bar>
      <div class="progress-label">{{ order.spent }} / {{ order.amount }}</div>
    </div>
  </td>
</ng-container>

<!-- Budget Column -->
<ng-container matColumnDef="amount">
  <th mat-header-cell *matHeaderCellDef> Budget </th>
  <td mat-cell *matCellDef="let order"> {{ order.amount }} </td>
</ng-container>

<!-- Left Column -->
<ng-container matColumnDef="left">
  <th mat-header-cell *matHeaderCellDef> Left </th>
  <td mat-cell *matCellDef="let order"> {{ order.left }} </td>
</ng-container>

<!-- Status Column -->
<ng-container matColumnDef="status">
  <th mat-header-cell *matHeaderCellDef> Status </th>
  <td mat-cell *matCellDef="let order">
    <span class="status-pill" [ngClass]="statusMap[order.status]?.color">
      {{ statusMap[order.status]?.label }}
    </span>
  </td>
</ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button>View all</a>
  </mat-card-actions>
</mat-card>
